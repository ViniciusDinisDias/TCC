<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Fama Fashion — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/css/estilos.css?v={{ static_version('css/estilos.css') }}">
</head>
<body class="pagina-login">
  <div class="login-tela">
    <div class="login-card">
     <div class="login-marca">
  <div class="login-marca-mono">
    <svg width="18" height="18" viewBox="0 0 100 100">
      <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24,28 V72"/>
        <path d="M24,28 H46"/>
        <path d="M24,48 H56"/>
        <path d="M64,28 L52,72"/>
        <path d="M64,28 L76,72"/>
        <path d="M56,58 H72"/>
      </g>
    </svg>
  </div>
  <div>
    <div class="login-marca-nome">Fashion Analytics</div>
    <div class="login-marca-sub">Fama Fashion</div>
  </div>
</div>
      </div>
      <h1 class="login-titulo">Entrar</h1>
      {% if erro %}<p class="login-erro">{{ erro }}</p>{% endif %}
      <form method="post" action="/login" class="formulario login-formulario">
        <label>Usuário</label>
        <input type="text" name="login" required autofocus>
        <label>Senha</label>
        <input type="password" name="senha" required>
        <button type="submit" class="btn">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
