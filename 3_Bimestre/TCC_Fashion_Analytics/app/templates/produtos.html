{% extends "base.html" %}
{% block scripts %}<script src="/static/js/produtos.js?v={{ static_version('js/produtos.js') }}" defer></script>{% endblock %}
{% block conteudo %}
<div class="topo">
  <div>
    <h1>Produtos</h1>
    <p class="subtitulo">Gerencie o catálogo de produtos</p>
  </div>
  {% if usuario.papel == 'admin' %}
  <button type="button" id="botao-novo-produto" class="btn">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
  Novo Produto
</button>
  {% endif %}
</div>

<div class="busca">
  <svg class="busca-icone" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  <input type="text" id="busca-produto" placeholder="Buscar por nome ou SKU...">
</div>

<div class="produtos-grade" id="grade-produtos"></div>

<div id="modal-produto-overlay" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-cabecalho">
      <h2 id="modal-produto-titulo">Novo produto</h2>
      <button type="button" id="botao-fechar-modal" class="icon-btn" aria-label="Fechar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <form id="form-produto" class="formulario formulario-modal">
      <input type="hidden" id="produto-id">
      <label>SKU</label>
      <input type="text" id="produto-sku" required>
      <label>Nome</label>
      <input type="text" id="produto-nome" required>
      <label>Categoria</label>
      <input type="text" id="produto-categoria" required>
      <label>Tamanho</label>
      <input type="text" id="produto-tamanho" required>
      <label>Cor</label>
      <input type="text" id="produto-cor" required>
      <label>Preço (R$)</label>
      <input type="number" id="produto-preco" step="0.01" min="0" required>
      <label>Quantidade em estoque</label>
      <input type="number" id="produto-quantidade" min="0" required>
      <label>Estoque mínimo</label>
      <input type="number" id="produto-estoque-minimo" min="0" value="5" required>
      <button type="submit" class="btn">Salvar produto</button>
    </form>
  </div>
</div>
{% endblock %}
